# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # To group all GitHub Actions updates into a single PR, uncomment the following:
    # groups:
    #   github-actions:
    #     patterns:
    #       - "*"
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/docs"
      - "/test"
    schedule:
      interval: "weekly"
    # To group all Julia dependency updates into a single PR, uncomment the following:
    # groups:
    #   julia-dependencies:
    #     patterns:
    #       - "*"
    ignore:
      # RocksDB_jll's UUID is deterministic and already registered upstream
      # under an older, less complete build (see CLAUDE.md); this repo
      # intentionally depends on a locally-built, Pkg.develop-ed version
      # from bindings/, not whatever Dependabot finds in the registry.
      - dependency-name: "RocksDB_jll"
